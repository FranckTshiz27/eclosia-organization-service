spring.application.name=eclosia-organization-service

server.port=8082

server.servlet.context-path=/api-organization

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5433/eclosia
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# KEYCLOAK / JWT
# ===============================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/eclosia


spring.cloud.gateway.discovery.locator.lower-case-service-id=true
logging.pattern.console=%boldGreen(%d{yyyy-MM-dd HH:mm:ss}) %-4relative [%boldMagenta(%thread)] [%highlight(%level)] %cyan(%-60logger{50}) : %boldGreen(%msg%n)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=WARN

# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.display-request-duration=true